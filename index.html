<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>烏龜日常紀錄 - 專業療癒版</title>
  
  <!-- 📌 iPhone 桌面 App 圖示 -->
  <link rel="apple-touch-icon" href="image.png">
  <link rel="icon" type="image/png" href="image.png">

  <!-- 引入 Tailwind CSS (療癒清新版面與動畫) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- 引入 SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sage-50': '#F3F7F4', 'sage-100': '#E1ECE3', 'sage-200': '#C4D7C9',
            'sage-300': '#9CBFA3', 'sage-500': '#6B9071', 'sage-700': '#4A694D',
            'earth-100': '#FDFBF7',
          },
          fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'], }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    
    body { background-color: #F3F7F4; color: #4A694D; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #9CBFA3; border-radius: 10px; }
    
    input[type="file"] { display: none; }
    
    .tab-active { background-color: #6B9071; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .tab-inactive { background-color: #E1ECE3; color: #4A694D; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .photo-preview { aspect-ratio: 1 / 1; object-fit: cover; border-radius: 0.5rem; border: 2px solid #E1ECE3; }
    
    .section-content { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; overflow: hidden; }
  </style>
</head>
<body class="min-h-screen pb-24 font-sans selection:bg-sage-300 selection:text-white" onclick="initAudio()">

  <!-- 頂部導覽列與時鐘 (自動去背 Logo) -->
  <header class="bg-sage-50 backdrop-blur-md shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center rounded-b-2xl mb-4 border-b border-sage-100/50">
    <div class="flex items-center gap-2">
      <!-- 🌟 CSS 魔法區：自動將淺色背景透明化，保留烏龜本體 🌟 -->
      <img src="image.png" alt="專屬Logo" class="w-14 h-14 object-cover mix-blend-multiply" style="filter: contrast(1.15) brightness(1.05);" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2QxZDVkOCI+PHBhdGggZD0iTTEyIDJhMTAgMTAgMCAxIDAgMTAgMTAgMTAgMTAgMCAwIDAtMTAtMTB6Ii8+PC9zdmc+'">
      <div>
        <h1 class="text-lg font-bold text-sage-700 tracking-wider">烏龜日常紀錄</h1>
        <div id="clockDisplay" class="text-xs text-sage-500 font-medium opacity-80">00:00:00</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="shareApp()" class="p-2 rounded-full bg-white/60 text-sage-500 hover:bg-sage-100 transition shadow-sm">
        <i class="ph ph-share-network text-xl"></i>
      </button>
      <button onclick="openSettings()" class="p-2 rounded-full bg-white/60 text-sage-500 hover:bg-sage-100 transition shadow-sm">
        <i class="ph ph-gear text-xl"></i>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-4">

    <!-- 日期選擇器 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-sage-50 flex items-center gap-3">
      <div class="bg-sage-100 p-3 rounded-xl text-sage-700">
        <i class="ph ph-calendar-check text-2xl"></i>
      </div>
      <div class="flex-1">
        <label class="block text-xs font-bold text-gray-400 mb-1" id="formTitle">今日紀錄</label>
        <input type="date" id="datePicker" class="w-full bg-transparent text-sage-700 font-bold outline-none cursor-pointer text-lg" onchange="loadDateData()">
      </div>
      <div id="dateBadge" class="text-sm font-bold text-sage-500 bg-sage-50 px-3 py-1 rounded-lg"></div>
    </section>

    <!-- 燈具更換紀錄 (到期閃爍功能) -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-sage-50">
      <h2 class="text-sm font-bold text-sage-700 mb-3 flex items-center gap-2"><i class="ph ph-lightbulb"></i> 燈具狀態</h2>
      <div class="flex justify-between items-center gap-4">
        <div class="flex-1 flex flex-col items-center gap-1 cursor-pointer bg-sage-50 p-3 rounded-xl hover:bg-sage-100 transition" onclick="updateLampDate('uvb')">
          <i id="uvb-icon" class="ph ph-sun-dim text-2xl text-yellow-500 transition-colors duration-300"></i>
          <span class="text-xs font-bold text-gray-500">UVB燈</span>
          <span id="uvb-date-display" class="text-sm font-bold text-sage-700 transition-colors duration-300">--天前</span>
        </div>
        <div class="flex-1 flex flex-col items-center gap-1 cursor-pointer bg-sage-50 p-3 rounded-xl hover:bg-sage-100 transition" onclick="updateLampDate('heat')">
          <i id="heat-icon" class="ph ph-thermometer-hot text-2xl text-orange-500 transition-colors duration-300"></i>
          <span class="text-xs font-bold text-gray-500">加熱燈</span>
          <span id="heat-date-display" class="text-sm font-bold text-sage-700 transition-colors duration-300">--天前</span>
        </div>
      </div>
    </section>

    <!-- 烏龜頁籤 -->
    <div id="turtleTabs" class="flex gap-2 hidden">
      <button id="tab-0" onclick="switchTurtle(0)" class="flex-1 py-3 rounded-xl font-bold transition duration-300 tab-active flex justify-center items-center gap-2">
        <i class="ph-fill ph-turtle"></i> <span id="tab-name-0">烏龜 A</span>
      </button>
      <button id="tab-1" onclick="switchTurtle(1)" class="flex-1 py-3 rounded-xl font-bold transition duration-300 tab-inactive flex justify-center items-center gap-2">
        <i class="ph-fill ph-turtle"></i> <span id="tab-name-1">烏龜 B</span>
      </button>
    </div>

    <!-- 完整紀錄表單區塊 -->
    <section class="space-y-4">
      
      <!-- 區塊 1：身體密碼 -->
      <div class="bg-white rounded-2xl shadow-sm border border-sage-50 overflow-hidden">
        <div class="p-4 bg-sage-50/50 flex justify-between items-center cursor-pointer" onclick="toggleSection('sec-body')">
          <h3 class="font-bold text-sage-700 flex items-center gap-2"><i class="ph ph-ruler"></i> 身體數值</h3>
          <i class="ph ph-caret-down text-sage-500 transition-transform duration-300" id="arrow-sec-body"></i>
        </div>
        <div id="sec-body" class="section-content p-4 grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-xs font-bold text-gray-400 mb-1">體重 (g)</label>
            <input type="number" id="input-weight" placeholder="例: 150" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">背甲長 (cm)</label>
            <input type="number" id="input-length" step="0.1" placeholder="例: 8.5" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">背甲寬 (cm)</label>
            <input type="number" id="input-width" step="0.1" placeholder="例: 7.2" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
          </div>
        </div>
      </div>

      <!-- 區塊 2：環境與日常 -->
      <div class="bg-white rounded-2xl shadow-sm border border-sage-50 overflow-hidden">
        <div class="p-4 bg-sage-50/50 flex justify-between items-center cursor-pointer" onclick="toggleSection('sec-env')">
          <h3 class="font-bold text-sage-700 flex items-center gap-2"><i class="ph ph-thermometer"></i> 環境與日常</h3>
          <i class="ph ph-caret-down text-sage-500 transition-transform duration-300" id="arrow-sec-env"></i>
        </div>
        <div id="sec-env" class="section-content p-4 space-y-3">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-400 mb-1">溫度 (°C)</label>
              <input type="number" id="input-temp" placeholder="例: 30" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-400 mb-1">濕度 (%)</label>
              <input type="number" id="input-humid" placeholder="例: 60" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">泡水紀錄</label>
            <input type="text" id="input-soak" placeholder="例: 溫水泡 15 分鐘" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
          </div>
        </div>
      </div>

      <!-- 區塊 3：飲食與排泄 -->
      <div class="bg-white rounded-2xl shadow-sm border border-sage-50 overflow-hidden">
        <div class="p-4 bg-sage-50/50 flex justify-between items-center cursor-pointer" onclick="toggleSection('sec-diet')">
          <h3 class="font-bold text-sage-700 flex items-center gap-2"><i class="ph ph-leaf"></i> 飲食與排泄</h3>
          <i class="ph ph-caret-down text-sage-500 transition-transform duration-300" id="arrow-sec-diet"></i>
        </div>
        <div id="sec-diet" class="section-content p-4 space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">餵食內容</label>
            <textarea id="input-diet" rows="2" placeholder="今天吃了什麼？" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 resize-none transition"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-400 mb-1">排便</label>
              <select id="input-poop" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
                <option value="">請選擇</option>
                <option value="無">無</option>
                <option value="正常">正常</option>
                <option value="水便/異常">水便/異常</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-400 mb-1">排酸</label>
              <select id="input-urate" class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 transition">
                <option value="">請選擇</option>
                <option value="無">無</option>
                <option value="牙膏狀(佳)">牙膏狀 (佳)</option>
                <option value="水狀(佳)">水狀 (佳)</option>
                <option value="顆粒/結石">顆粒/結石</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 區塊 4：照片與備註 -->
      <div class="bg-white rounded-2xl shadow-sm border border-sage-50 overflow-hidden">
        <div class="p-4 bg-sage-50/50 flex justify-between items-center cursor-pointer" onclick="toggleSection('sec-note')">
          <h3 class="font-bold text-sage-700 flex items-center gap-2"><i class="ph ph-camera"></i> 日常影像庫與備註</h3>
          <i class="ph ph-caret-down text-sage-500 transition-transform duration-300" id="arrow-sec-note"></i>
        </div>
        <div id="sec-note" class="section-content p-4 space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">生活備註</label>
            <textarea id="input-notes" rows="2" placeholder="紀錄今天的活動力、趣事等..." class="w-full bg-sage-50 text-sage-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-sage-300 resize-none transition"></textarea>
          </div>
          <div>
            <label class="flex justify-between items-center text-xs font-bold text-gray-400 mb-2">
              <span>生活照 (自動壓縮不佔空間)</span>
              <span id="photo-count" class="bg-sage-100 text-sage-700 px-2 py-1 rounded-md">0/6</span>
            </label>
            <div class="photo-grid mb-2" id="photo-container"></div>
            <label class="flex justify-center items-center gap-2 w-full bg-earth-100 text-sage-700 p-3 rounded-xl cursor-pointer hover:bg-sage-100 transition font-bold border-2 border-dashed border-sage-200">
              <i class="ph ph-images text-xl"></i> 新增今日照片
              <input type="file" id="photo-upload" accept="image/*" multiple onchange="handlePhotoUpload(event)">
            </label>
          </div>
        </div>
      </div>

      <!-- 儲存按鈕 -->
      <button onclick="saveCurrentData()" class="w-full bg-sage-500 text-white font-bold text-lg p-4 rounded-xl shadow-md hover:bg-sage-700 active:scale-95 transition duration-200 mt-2 flex justify-center items-center gap-2">
        <i class="ph ph-floppy-disk"></i> 儲存今日紀錄
      </button>
    </section>

    <!-- 隱藏版對照表 (兩隻烏龜時才顯示) -->
    <section id="comparison-section" class="hidden mt-4">
      <button onclick="toggleComparison()" class="w-full bg-white text-sage-700 font-bold p-3 rounded-xl shadow-sm border border-sage-100 hover:bg-sage-50 transition flex justify-center items-center gap-2">
        <i id="comp-icon" class="ph ph-eye"></i> <span id="comp-text">顯示 雙龜狀態對照表</span>
      </button>
      
      <div id="comparison-table" class="bg-white rounded-2xl p-4 shadow-sm border border-sage-50 hidden mt-2 transition-all">
        <div class="grid grid-cols-2 gap-3">
          <!-- 烏龜 0 -->
          <div class="bg-sage-50 p-3 rounded-lg text-xs space-y-1">
            <h4 id="comp-name-0" class="font-bold text-center mb-2 text-sage-700 border-b border-sage-200 pb-1 text-sm">龜A</h4>
            <p><span class="text-gray-400">體重:</span> <span id="comp-weight-0" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">長/寬:</span> <span id="comp-size-0" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">排便:</span> <span id="comp-poop-0" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">排酸:</span> <span id="comp-urate-0" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">泡水:</span> <span id="comp-soak-0" class="font-bold text-sage-700">-</span></p>
            <p class="text-gray-400 pt-1 border-t border-sage-200">飲食:</p>
            <p id="comp-diet-0" class="text-sage-700 line-clamp-2">-</p>
          </div>
          <!-- 烏龜 1 -->
          <div class="bg-sage-50 p-3 rounded-lg text-xs space-y-1">
            <h4 id="comp-name-1" class="font-bold text-center mb-2 text-sage-700 border-b border-sage-200 pb-1 text-sm">龜B</h4>
            <p><span class="text-gray-400">體重:</span> <span id="comp-weight-1" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">長/寬:</span> <span id="comp-size-1" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">排便:</span> <span id="comp-poop-1" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">排酸:</span> <span id="comp-urate-1" class="font-bold text-sage-700">-</span></p>
            <p><span class="text-gray-400">泡水:</span> <span id="comp-soak-1" class="font-bold text-sage-700">-</span></p>
            <p class="text-gray-400 pt-1 border-t border-sage-200">飲食:</p>
            <p id="comp-diet-1" class="text-sage-700 line-clamp-2">-</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 底部生日顯示區 -->
    <div id="birthdays-container" class="text-center space-y-2 mt-8 hidden">
      <div class="inline-flex flex-col items-center gap-1 bg-white/60 px-5 py-2.5 rounded-2xl shadow-sm border border-white/50 backdrop-blur-sm">
        <div class="text-xs font-bold text-sage-700">🎂 <span id="bday-text-0"></span></div>
        <div id="age-text-0" class="text-[10px] text-sage-500 font-bold bg-sage-100 px-2 py-0.5 rounded-full"></div>
      </div>
      <br>
      <div id="bday-box-1" class="inline-flex flex-col items-center gap-1 bg-white/60 px-5 py-2.5 rounded-2xl shadow-sm border border-white/50 backdrop-blur-sm hidden">
        <div class="text-xs font-bold text-sage-700">🎂 <span id="bday-text-1"></span></div>
        <div id="age-text-1" class="text-[10px] text-sage-500 font-bold bg-sage-100 px-2 py-0.5 rounded-full"></div>
      </div>
    </div>

    <!-- 底部專屬品牌小 Logo (同樣自動去背) -->
    <div class="text-center mt-6 mb-2 flex justify-center items-center gap-1.5 opacity-60 hover:opacity-100 transition cursor-default">
      <img src="image.png" alt="Logo" class="w-6 h-6 object-cover mix-blend-multiply grayscale" style="filter: contrast(1.15) brightness(1.05);" onerror="this.style.display='none'">
      <span class="text-[10px] font-bold text-sage-700 tracking-widest uppercase">Turtle Daily Tracker</span>
    </div>

  </main>

  <!-- 設定視窗 (Modal) -->
  <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl transform transition-all relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-sage-700 transition">
        <i class="ph ph-x-circle text-2xl"></i>
      </button>
      
      <h2 class="text-xl font-bold text-sage-700 mb-6 flex items-center gap-2">
        <i class="ph ph-gear"></i> 系統設定
      </h2>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">飼養數量</label>
          <select id="set-count" class="w-full bg-sage-50 p-3 rounded-xl text-sage-700 font-bold border-none outline-none focus:ring-2 focus:ring-sage-300 transition" onchange="toggleSettingsForm()">
            <option value="1">1 隻</option>
            <option value="2">2 隻</option>
          </select>
        </div>

        <div class="bg-sage-50 p-4 rounded-xl border border-sage-100">
          <h3 class="font-bold text-sage-700 mb-3 border-b border-sage-200 pb-1 text-sm">第一隻寶貝</h3>
          <input type="text" id="set-name-0" placeholder="名字" class="w-full mb-3 p-2 rounded-lg bg-white border-none outline-none text-sm focus:ring-2 focus:ring-sage-300 transition">
          <label class="block text-xs text-gray-400 mb-1">推算生日 / 到家日</label>
          <input type="date" id="set-bday-0" class="w-full p-2 rounded-lg bg-white border-none outline-none text-sm text-gray-600 focus:ring-2 focus:ring-sage-300 transition">
        </div>

        <div id="settings-turtle-2" class="bg-sage-50 p-4 rounded-xl border border-sage-100 hidden">
          <h3 class="font-bold text-sage-700 mb-3 border-b border-sage-200 pb-1 text-sm">第二隻寶貝</h3>
          <input type="text" id="set-name-1" placeholder="名字" class="w-full mb-3 p-2 rounded-lg bg-white border-none outline-none text-sm focus:ring-2 focus:ring-sage-300 transition">
          <label class="block text-xs text-gray-400 mb-1">推算生日 / 到家日</label>
          <input type="date" id="set-bday-1" class="w-full p-2 rounded-lg bg-white border-none outline-none text-sm text-gray-600 focus:ring-2 focus:ring-sage-300 transition">
        </div>

        <button onclick="saveSettings()" class="w-full bg-sage-700 text-white font-bold p-3 rounded-xl mt-4 hover:bg-sage-800 transition shadow-md">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    function playClickSound() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    const DB = {
      dbName: 'TurtleProDB', storeSettings: 'settingsStore', storeData: 'dataStore', db: null,
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeSettings)) db.createObjectStore(this.storeSettings);
            if (!db.objectStoreNames.contains(this.storeData)) db.createObjectStore(this.storeData);
          };
          request.onsuccess = (e) => { this.db = e.target.result; resolve(); };
          request.onerror = (e) => reject(e);
        });
      },
      async get(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },
      async set(storeName, key, value) {
        return new Promise((resolve, reject) => {
          const tx = this.db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }
    };

    let appState = { turtles: [{ name: "小烏龜", birthday: "" }], lamps: { uvb: "", heat: "" } };
    const createEmptyRecord = () => ({ weight: "", length: "", width: "", temp: "", humid: "", soak: "", diet: "", poop: "", urate: "", notes: "", photos: [] });
    let currentDailyData = [createEmptyRecord(), createEmptyRecord()];
    let activeTurtleIndex = 0;
    let selectedDate = new Date().toISOString().split('T')[0];

    function calculateAge(bdayStr) {
      if (!bdayStr) return '尚未設定日期';
      const bday = new Date(bdayStr);
      const today = new Date();
      if (bday > today) return '還沒出生/到家呢';

      let years = today.getFullYear() - bday.getFullYear();
      let months = today.getMonth() - bday.getMonth();
      let days = today.getDate() - bday.getDate();

      if (days < 0) {
        months--;
        const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += lastMonth.getDate();
      }
      if (months < 0) { years--; months += 12; }

      let ageParts = [];
      if (years > 0) ageParts.push(`${years} 歲`);
      if (months > 0) ageParts.push(`${months} 個月`);
      if (years === 0 && months === 0 && days > 0) ageParts.push(`${days} 天`);
      
      if (years === 0 && months === 0 && days === 0) return '今天剛到家！🎉';
      return `已陪伴 ${ageParts.join(' ')}`;
    }

    function getShortAge(bdayStr) {
      if (!bdayStr) return '';
      const text = calculateAge(bdayStr);
      return text.replace('已陪伴 ', '').replace('尚未設定日期', '').replace('還沒出生/到家呢', '');
    }

    async function initApp() {
      await DB.init();
      updateClock();
      setInterval(updateClock, 1000);
      
      selectedDate = new Date().toISOString().split('T')[0];
      document.getElementById('datePicker').value = selectedDate;
      document.getElementById('dateBadge').textContent = formatDateBadge(selectedDate);
      
      const savedSettings = await DB.get(DB.storeSettings, 'userConfig');
      if (savedSettings) {
        appState = { ...appState, ...savedSettings };
      } else {
        setTimeout(openSettings, 500);
      }

      updateLampUI();
      renderAppLayout();
      loadDateData(); 
    }

    function updateClock() {
      const t = new Date();
      const h = String(t.getHours()).padStart(2, '0');
      const m = String(t.getMinutes()).padStart(2, '0');
      const s = String(t.getSeconds()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;
    }

    function formatDateBadge(dateStr) {
      const d = new Date(dateStr);
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function toggleSection(id) {
      playClickSound(); 
      const el = document.getElementById(id);
      const arrow = document.getElementById('arrow-' + id);
      if (el.style.maxHeight && el.style.maxHeight !== '0px') {
        el.style.maxHeight = '0px';
        arrow.style.transform = 'rotate(-90deg)';
        setTimeout(() => el.style.opacity = '0', 200);
      } else {
        el.style.opacity = '1';
        el.style.maxHeight = '800px';
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function renderAppLayout() {
      const isTwoTurtles = appState.turtles.length === 2;
      const t0 = appState.turtles[0];
      const age0 = getShortAge(t0.birthday);
      
      document.getElementById('tab-name-0').innerText = t0.name || "烏龜 A";
      document.getElementById('comp-name-0').innerText = `${t0.name || "烏龜 A"} ${age0 ? `(${age0})` : ''}`;
      document.getElementById('bday-text-0').innerText = `${t0.name} : ${t0.birthday || '未設定'}`;
      document.getElementById('age-text-0').innerText = calculateAge(t0.birthday);
      
      if (isTwoTurtles) {
        const t1 = appState.turtles[1];
        const age1 = getShortAge(t1.birthday);
        document.getElementById('tab-name-1').innerText = t1.name || "烏龜 B";
        document.getElementById('comp-name-1').innerText = `${t1.name || "烏龜 B"} ${age1 ? `(${age1})` : ''}`;
        document.getElementById('bday-text-1').innerText = `${t1.name} : ${t1.birthday || '未設定'}`;
        document.getElementById('age-text-1').innerText = calculateAge(t1.birthday);
        
        document.getElementById('turtleTabs').classList.remove('hidden');
        document.getElementById('comparison-section').classList.remove('hidden');
        document.getElementById('bday-box-1').classList.remove('hidden');
      } else {
        document.getElementById('turtleTabs').classList.add('hidden');
        document.getElementById('comparison-section').classList.add('hidden');
        document.getElementById('bday-box-1').classList.add('hidden');
        activeTurtleIndex = 0;
      }
      
      document.getElementById('birthdays-container').classList.remove('hidden');
      switchTurtle(activeTurtleIndex);
      
      ['sec-body', 'sec-diet'].forEach(id => {
        const el = document.getElementById(id);
        if(!el.style.maxHeight || el.style.maxHeight === '0px') toggleSection(id);
      });
    }

    function switchTurtle(index) {
      if (index >= appState.turtles.length) index = 0;
      saveFormToTemp(); 
      activeTurtleIndex = index;
      
      if(index === 0 || index === 1) playClickSound(); 
      
      document.getElementById('tab-0').className = index === 0 ? "flex-1 py-3 rounded-xl font-bold transition duration-300 tab-active flex justify-center items-center gap-2" : "flex-1 py-3 rounded-xl font-bold transition duration-300 tab-inactive flex justify-center items-center gap-2";
      document.getElementById('tab-1').className = index === 1 ? "flex-1 py-3 rounded-xl font-bold transition duration-300 tab-active flex justify-center items-center gap-2" : "flex-1 py-3 rounded-xl font-bold transition duration-300 tab-inactive flex justify-center items-center gap-2";

      loadTempToForm(); 
    }

    async function loadDateData() {
      playClickSound(); 
      selectedDate = document.getElementById('datePicker').value;
      document.getElementById('dateBadge').textContent = formatDateBadge(selectedDate);
      currentDailyData = [createEmptyRecord(), createEmptyRecord()];
      const data = await DB.get(DB.storeData, selectedDate);
      if (data) {
        if(data[0]) Object.assign(currentDailyData[0], data[0]);
        if(data[1]) Object.assign(currentDailyData[1], data[1]);
      }
      loadTempToForm();
      updateComparisonTable();
    }

    function saveFormToTemp() {
      const d = currentDailyData[activeTurtleIndex];
      d.weight = document.getElementById('input-weight').value;
      d.length = document.getElementById('input-length').value;
      d.width = document.getElementById('input-width').value;
      d.temp = document.getElementById('input-temp').value;
      d.humid = document.getElementById('input-humid').value;
      d.soak = document.getElementById('input-soak').value;
      d.diet = document.getElementById('input-diet').value;
      d.poop = document.getElementById('input-poop').value;
      d.urate = document.getElementById('input-urate').value;
      d.notes = document.getElementById('input-notes').value;
    }

    function loadTempToForm() {
      const d = currentDailyData[activeTurtleIndex];
      document.getElementById('input-weight').value = d.weight || "";
      document.getElementById('input-length').value = d.length || "";
      document.getElementById('input-width').value = d.width || "";
      document.getElementById('input-temp').value = d.temp || "";
      document.getElementById('input-humid').value = d.humid || "";
      document.getElementById('input-soak').value = d.soak || "";
      document.getElementById('input-diet').value = d.diet || "";
      document.getElementById('input-poop').value = d.poop || "";
      document.getElementById('input-urate').value = d.urate || "";
      document.getElementById('input-notes').value = d.notes || "";
      renderPhotos();
    }

    async function saveCurrentData() {
      playClickSound(); 
      saveFormToTemp();
      try {
        await DB.set(DB.storeData, selectedDate, currentDailyData);
        updateComparisonTable();
        Swal.fire({ icon: 'success', title: '儲存成功', confirmButtonColor: '#6B9071', timer: 1500 });
      } catch (err) {
        Swal.fire({ icon: 'error', title: '儲存失敗', text: err.message });
      }
    }

    function calcDays(dateString) {
      if (!dateString) return '--';
      return Math.floor((new Date().getTime() - new Date(dateString).getTime()) / (1000 * 3600 * 24));
    }

    function updateLampUI() {
      const uvbDays = calcDays(appState.lamps.uvb);
      const heatDays = calcDays(appState.lamps.heat);

      const uvbDisp = document.getElementById('uvb-date-display');
      const uvbIcon = document.getElementById('uvb-icon');
      uvbDisp.innerText = uvbDays !== '--' ? `${uvbDays}天前` : '--天前';
      
      if (uvbDays !== '--' && uvbDays >= 180) { 
        uvbDisp.classList.replace('text-sage-700', 'text-red-500'); uvbDisp.classList.add('animate-pulse');
        uvbIcon.classList.replace('text-yellow-500', 'text-red-500'); uvbIcon.classList.add('animate-pulse');
      } else {
        uvbDisp.classList.replace('text-red-500', 'text-sage-700'); uvbDisp.classList.remove('animate-pulse');
        uvbIcon.classList.replace('text-red-500', 'text-yellow-500'); uvbIcon.classList.remove('animate-pulse');
      }

      const heatDisp = document.getElementById('heat-date-display');
      const heatIcon = document.getElementById('heat-icon');
      heatDisp.innerText = heatDays !== '--' ? `${heatDays}天前` : '--天前';
      
      if (heatDays !== '--' && heatDays >= 365) { 
        heatDisp.classList.replace('text-sage-700', 'text-red-500'); heatDisp.classList.add('animate-pulse');
        heatIcon.classList.replace('text-orange-500', 'text-red-500'); heatIcon.classList.add('animate-pulse');
      } else {
        heatDisp.classList.replace('text-red-500', 'text-sage-700'); heatDisp.classList.remove('animate-pulse');
        heatIcon.classList.replace('text-red-500', 'text-orange-500'); heatIcon.classList.remove('animate-pulse');
      }
    }

    async function updateLampDate(type) {
      playClickSound(); 
      const name = type === 'uvb' ? 'UVB燈' : '加熱燈';
      const res = await Swal.fire({
        title: `更換${name}?`, text: "確定記錄更換日期為今天嗎？", icon: 'question',
        showCancelButton: true, confirmButtonColor: '#6B9071', confirmButtonText: '確定', cancelButtonText: '取消'
      });
      if (res.isConfirmed) {
        appState.lamps[type] = new Date().toISOString().split('T')[0];
        await DB.set(DB.storeSettings, 'userConfig', appState);
        updateLampUI();
        Swal.fire({ icon: 'success', title: '已記錄', timer: 1000, showConfirmButton: false });
      }
    }

    let isCompVisible = false;
    function toggleComparison() {
      playClickSound(); 
      isCompVisible = !isCompVisible;
      const table = document.getElementById('comparison-table');
      const icon = document.getElementById('comp-icon');
      const text = document.getElementById('comp-text');
      if (isCompVisible) {
        table.classList.remove('hidden');
        icon.className = "ph ph-eye-closed"; text.innerText = "隱藏 雙龜狀態對照表";
        updateComparisonTable();
      } else {
        table.classList.add('hidden');
        icon.className = "ph ph-eye"; text.innerText = "顯示 雙龜狀態對照表";
      }
    }

    function updateComparisonTable() {
      saveFormToTemp();
      for (let i = 0; i < 2; i++) {
        const d = currentDailyData[i];
        document.getElementById(`comp-weight-${i}`).innerText = d.weight ? `${d.weight}g` : '-';
        document.getElementById(`comp-size-${i}`).innerText = (d.length || d.width) ? `${d.length||'-'} / ${d.width||'-'} cm` : '-';
        document.getElementById(`comp-poop-${i}`).innerText = d.poop || '-';
        document.getElementById(`comp-urate-${i}`).innerText = d.urate || '-';
        document.getElementById(`comp-soak-${i}`).innerText = d.soak || '-';
        document.getElementById(`comp-diet-${i}`).innerText = d.diet || '-';
      }
    }

    async function handlePhotoUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      let currentPhotos = currentDailyData[activeTurtleIndex].photos;
      if (currentPhotos.length + files.length > 6) {
        Swal.fire({ icon: 'warning', title: '照片限制', text: '一天最多只能上傳 6 張照片喔！', confirmButtonColor: '#6B9071' });
        return;
      }
      playClickSound();
      Swal.fire({ title: '照片壓縮處理中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      for (let file of files) {
        try { const base64 = await compressImage(file, 800); currentPhotos.push(base64); } catch (e) {}
      }
      Swal.close(); renderPhotos(); event.target.value = ''; 
    }

    function renderPhotos() {
      const photos = currentDailyData[activeTurtleIndex].photos;
      const container = document.getElementById('photo-container');
      document.getElementById('photo-count').innerText = `${photos.length}/6`;
      container.innerHTML = '';
      photos.forEach((base64, idx) => {
        const wrapper = document.createElement('div'); wrapper.className = "relative group";
        const img = document.createElement('img'); img.src = base64; img.className = "photo-preview w-full shadow-sm";
        const delBtn = document.createElement('button'); delBtn.innerHTML = '<i class="ph-fill ph-x-circle"></i>';
        delBtn.className = "absolute -top-2 -right-2 text-red-400 bg-white rounded-full text-xl opacity-90 hover:opacity-100 transition";
        delBtn.onclick = () => { playClickSound(); currentDailyData[activeTurtleIndex].photos.splice(idx, 1); renderPhotos(); };
        wrapper.appendChild(img); wrapper.appendChild(delBtn); container.appendChild(wrapper);
      });
    }

    function compressImage(file, maxWidth) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          }; img.onerror = reject;
        }; reader.onerror = reject;
      });
    }

    function openSettings() {
      playClickSound(); 
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('set-count').value = appState.turtles.length;
      toggleSettingsForm();
      document.getElementById('set-name-0').value = appState.turtles[0]?.name || "";
      document.getElementById('set-bday-0').value = appState.turtles[0]?.birthday || "";
      if (appState.turtles.length > 1) {
        document.getElementById('set-name-1').value = appState.turtles[1]?.name || "";
        document.getElementById('set-bday-1').value = appState.turtles[1]?.birthday || "";
      }
    }

    function closeSettings() { playClickSound(); document.getElementById('settingsModal').classList.add('hidden'); }

    function toggleSettingsForm() {
      if (document.getElementById('set-count').value === "2") document.getElementById('settings-turtle-2').classList.remove('hidden');
      else document.getElementById('settings-turtle-2').classList.add('hidden');
    }

    async function saveSettings() {
      playClickSound(); 
      const count = parseInt(document.getElementById('set-count').value);
      let newTurtles = [{ name: document.getElementById('set-name-0').value || "烏龜 A", birthday: document.getElementById('set-bday-0').value }];
      if (count === 2) newTurtles.push({ name: document.getElementById('set-name-1').value || "烏龜 B", birthday: document.getElementById('set-bday-1').value });
      
      appState.turtles = newTurtles;
      await DB.set(DB.storeSettings, 'userConfig', appState);
      closeSettings();
      renderAppLayout();
      Swal.fire({ icon: 'success', title: '設定已更新', confirmButtonColor: '#6B9071', timer: 1500 });
    }

    async function shareApp() {
      playClickSound(); 
      const shareData = { title: '烏龜日常紀錄', text: '這是我專屬的烏龜日常紀錄小工具，超有質感！推薦給你～', url: window.location.href };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        try {
          const dummy = document.createElement('input'); document.body.appendChild(dummy);
          dummy.value = window.location.href; dummy.select(); document.execCommand('copy'); document.body.removeChild(dummy);
          Swal.fire({ icon: 'success', title: '網址已複製！', text: '您可以直接貼上網址分享', confirmButtonColor: '#6B9071', timer: 2000 });
        } catch (err) { Swal.fire({ icon: 'error', title: '複製失敗' }); }
      }
    }

    window.onload = initApp;
  </script>
